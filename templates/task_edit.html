{% extends "base.html" %}

{% block title %}
Редактиране на задача
{% endblock %}

{% block content %}

<h1>Редактиране на задача</h1>

<form method="POST">

    <div>
        <label for="title">Заглавие:</label>
        <br>

        <input
            type="text"
            id="title"
            name="title"
            value="{{ task.title }}"
            required
        >
    </div>

    <br>

    <div>
        <label for="description">Описание:</label>
        <br>

        <textarea
            id="description"
            name="description"
            rows="5"
        >{{ task.description or "" }}</textarea>
    </div>

    <br>

    <div>
        <label for="status">Статус:</label>
        <br>

        <select id="status" name="status">

            <option
                value="pending"
                {% if task.status == "pending" %}selected{% endif %}
            >
                Pending
            </option>

            <option
                value="in_progress"
                {% if task.status == "in_progress" %}selected{% endif %}
            >
                In Progress
            </option>

            <option
                value="completed"
                {% if task.status == "completed" %}selected{% endif %}
            >
                Completed
            </option>

        </select>
    </div>

    <br>

    <button type="submit">
        Запази промените
    </button>

</form>

{% endblock %}
